<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2720"/>
      <stop offset="100%" stop-color="#0F1713"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E9871"/>
      <stop offset="100%" stop-color="#2D6646"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55B884"/>
      <stop offset="100%" stop-color="#80E0AC"/>
    </linearGradient>
  </defs>

  <!-- Fundo arredondado com borda sutil -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#2D4236" stroke-width="6" opacity="0.6"/>

  <!-- Haltere Central Estilizado -->
  <g transform="translate(0, -12)">
    <!-- Barra Central -->
    <rect x="176" y="244" width="160" height="24" rx="12" fill="#D6E4DB"/>

    <!-- Anilha Esquerda Interna -->
    <rect x="144" y="200" width="28" height="112" rx="14" fill="url(#emeraldGrad)"/>
    <!-- Anilha Esquerda Externa -->
    <rect x="100" y="172" width="36" height="168" rx="18" fill="#E2EBE5"/>
    <!-- Anilha Esquerda Borda Extrema -->
    <rect x="76" y="212" width="18" height="88" rx="9" fill="#8FA89A"/>

    <!-- Anilha Direita Interna -->
    <rect x="340" y="200" width="28" height="112" rx="14" fill="url(#emeraldGrad)"/>
    <!-- Anilha Direita Externa -->
    <rect x="376" y="172" width="36" height="168" rx="18" fill="#E2EBE5"/>
    <!-- Anilha Direita Borda Extrema -->
    <rect x="418" y="212" width="18" height="88" rx="9" fill="#8FA89A"/>
  </g>

  <!-- Linha de Pulso Cardíaco / Eletrocardiograma (Saúde) sobreposta -->
  <path d="M 64 368 L 170 368 L 195 320 L 225 428 L 265 292 L 295 390 L 320 348 L 345 368 L 448 368"
        fill="none"
        stroke="url(#accentGrad)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
